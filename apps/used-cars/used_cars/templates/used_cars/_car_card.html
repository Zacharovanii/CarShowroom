{% load static used_cars_extras %}
{# Карточка объявления: общая для главной и списка, подключается через include #}
<div class="card h-100">
  <img src="{% static 'used_cars/car-placeholder.svg' %}" class="card-img-top car-photo" alt="{{ car }}">
  <div class="card-body d-flex flex-column">
    <div class="small text-body-secondary text-uppercase letter-spacing">{{ car.brand }}</div>
    <h5 class="card-title mb-1">{{ car.model }}</h5>
    <p class="card-text text-body-secondary small mb-3">
      {{ car.year }} г. · {{ car.mileage_km|km }}
    </p>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <span class="fs-5 fw-semibold">{{ car.price|rub }}</span>
      <a href="{% url 'car_detail' car.pk %}" class="btn btn-outline-primary btn-sm stretched-link">Подробнее</a>
    </div>
  </div>
</div>
