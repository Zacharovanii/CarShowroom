# Локальное окружение: база, веб-клиент к ней и S3-хранилище файлов (D26).
# Поднимается `docker compose -f docker/compose.yml up -d`.
services:
  db:
    image: postgres:17-alpine
    container_name: cs-db
    environment:
      POSTGRES_USER: carshowroom
      POSTGRES_PASSWORD: carshowroom
      POSTGRES_DB: carshowroom
    ports:
      # 5434 снаружи, а не 5432: стандартный порт часто занят другим
      # локальным postgres, и compose падает с «port is already allocated».
      # Значение должно совпадать с DATABASE_URL в apps/api/.env.
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carshowroom -d carshowroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Просмотр таблиц и связей в браузере: http://localhost:8080
  # Система — PostgreSQL, сервер — db, пользователь/пароль/база — carshowroom.
  adminer:
    image: adminer:5
    container_name: cs-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # S3-совместимое хранилище для фото и 3D-моделей, загруженных админом (D26).
  # Консоль: http://localhost:9001, пользователь/пароль — carshowroom/carshowroom123.
  # Образ — pgsty/minio, поддерживаемая сборка MinIO: официальные minio/minio
  # и minio/mc с Docker Hub (и quay.io) больше не раздаются.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: cs-minio
    command: server /data --console-address ":9001"
    environment:
      # Значения должны совпадать с S3_ACCESS_KEY/S3_SECRET_KEY в apps/api/.env.
      # Пароль не короче 8 символов — иначе MinIO не стартует.
      MINIO_ROOT_USER: carshowroom
      MINIO_ROOT_PASSWORD: carshowroom123
    ports:
      - "9000:9000" # S3 API — S3_ENDPOINT
      - "9001:9001" # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразово создаёт бакет и выходит. --ignore-existing — повторный
  # `up` не падает на уже созданном бакете. Бакет приватный: файлы отдаёт
  # Nest через /media/*, наружу MinIO не открывается (D26).
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: cs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 carshowroom carshowroom123 &&
        mc mb --ignore-existing local/carshowroom
    restart: "no"

volumes:
  db-data:
  minio-data:
