# Локальное окружение: база и веб-клиент к ней.
# Поднимается `docker compose -f docker/compose.yml up -d`.
services:
  db:
    image: postgres:17-alpine
    container_name: cs-db
    environment:
      POSTGRES_USER: carshowroom
      POSTGRES_PASSWORD: carshowroom
      POSTGRES_DB: carshowroom
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carshowroom -d carshowroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Просмотр таблиц и связей в браузере: http://localhost:8080
  # Система — PostgreSQL, сервер — db, пользователь/пароль/база — carshowroom.
  adminer:
    image: adminer:5
    container_name: cs-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
